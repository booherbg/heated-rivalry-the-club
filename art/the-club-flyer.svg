<rect x="-24" y="-6" width="140" height="40" fill="#e8dcc0" opacity=".75" transform="rotate(-16 46 14)"/>
<rect x="488" y="726" width="140" height="40" fill="#e8dcc0" opacity=".75" transform="rotate(12 558 746)"/>
