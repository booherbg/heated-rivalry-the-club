<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Heated Hockey</title>
<meta name="theme-color" content="#f1ece2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --pink: #ff2a8f; --blue: #2f55ff; --ink: #141016; --paper: #f1ece2; --tape: #e8dcc0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); overscroll-behavior: none; }
  body { font-family: "Courier New", "American Typewriter", monospace; -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }
  #rink { position: fixed; inset: 0; width: 100vw; height: 100dvh; touch-action: none; display: block; }
  .back {
    position: fixed; z-index: 3; left: max(10px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom));
    font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: none; background: var(--tape); padding: 6px 10px;
    transform: rotate(-3deg); box-shadow: 0 1px 0 rgba(0,0,0,.15);
  }
  .screen {
    position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(241, 236, 226, .72); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .card {
    position: relative; width: min(440px, 100%); background: var(--paper); padding: 26px 18px 18px; text-align: center;
    box-shadow: 0 0 0 2px var(--ink), 8px 8px 0 var(--pink), -8px -8px 0 var(--blue); transform: rotate(-1.2deg);
  }
  .card::before, .card::after { content: ""; position: absolute; width: 90px; height: 26px; background: var(--tape); opacity: .9; }
  .card::before { top: -12px; left: -18px; transform: rotate(-20deg); }
  .card::after { bottom: -10px; right: -16px; transform: rotate(-14deg); }
  .rainbow { height: 10px; margin: 0 -18px 16px; background: linear-gradient(90deg, #e40303 0 16.6%, #ff8c00 0 33.3%, #ffed00 0 50%, #008026 0 66.6%, #24408e 0 83.3%, #732982 0); }
  .ransom { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 3px; line-height: 1; }
  .ransom { column-gap: 14px; row-gap: 8px; }
  .ransom .word { display: inline-flex; gap: 3px; }
  .ransom .word span { display: inline-block; padding: 4px 5px; font-weight: 900; font-size: clamp(24px, 7.5vw, 40px); }
  h1, h2 { margin: 0 0 10px; }
  .q { font-size: 17px; margin: 10px 0 14px; }
  .pick { display: flex; gap: 12px; }
  .pick button, .row button, .row a {
    flex: 1; border: 2px solid var(--ink); background: var(--paper); padding: 12px 8px; font: 900 19px/1.15 Impact, "Arial Black", "Avenir Next Condensed", sans-serif;
    letter-spacing: .04em; color: var(--ink); cursor: pointer; text-decoration: none; display: block;
  }
  .pick button small { display: block; font: 700 12px "Courier New", monospace; letter-spacing: 0; margin-top: 5px; }
  #pickShane { background: var(--pink); transform: rotate(1.5deg); }
  #pickIlya { background: var(--blue); color: var(--paper); transform: rotate(-1.5deg); }
  .how { font-size: 13px; line-height: 1.45; margin: 14px 0 0; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  #overSub { font-size: 16px; line-height: 1.4; margin: 6px 0 0; }
</style>
</head>
<body>
<canvas id="rink"></canvas>
<a class="back" href="./">&larr; back to the club</a>

<div id="pick" class="screen">
  <div class="card">
    <div class="rainbow"></div>
    <h1 id="pickTitle"></h1>
    <p class="q">Who are you tonight?</p>
    <div class="pick">
      <button id="pickShane">HOLLANDER<small>pink, the swoop</small></button>
      <button id="pickIlya">ROZANOV<small>blue, the curls</small></button>
    </div>
    <p class="how">Drag up and down to move your guy. Keep the puck off your side. First to seven.
      Watch out for wolf birds.</p>
  </div>
</div>

<div id="over" class="screen" hidden>
  <div class="card">
    <div class="rainbow"></div>
    <h2 id="overTitle"></h2>
    <p id="overSub"></p>
    <div class="row">
      <button id="rematch">REMATCH</button>
      <button id="swap">SWITCH SIDES</button>
    </div>
    <div class="row"><a href="./">BACK TO THE CLUB</a></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
